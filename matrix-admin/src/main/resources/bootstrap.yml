server:
  port: 9002

spring:
  application:
    name: matrix-admin
  profiles:
    active: ${PROFILE:dev}
  config:
    import:
      - optional:nacos:env.properties
      - optional:nacos:application-common.yml
  boot:
    admin:
      discovery:
        ignored-services:
          - matrix-admin
  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}
  codec:
    max-in-memory-size: 2097152
