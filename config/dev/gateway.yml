# ===================== matrix-gateway 网关配置 =====================

spring:
  cloud:
    sentinel:
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDRESS:nacos:8848}
            namespace: ${spring.profiles.active}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWD:nacos}
            data-id: sentinel_rule_config-matrix-gateway-gateway-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: gw_flow
        gw-api-group:
          nacos:
            server-addr: ${NACOS_SERVER_ADDRESS:nacos:8848}
            namespace: ${spring.profiles.active}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWD:nacos}
            data-id: sentinel_rule_config-matrix-gateway-gateway-api-group
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: gw_api_group

    gateway:
      # CORS 允许的域名
      allow-origins:
        - http://localhost:8891
        - http://127.0.0.1:3000
        - http://localhost:3000
        - http://localhost:8889
        - http://localhost:8080
        - http://127.0.0.1:8848

      httpclient:
        connect-timeout: 5000
        response-timeout: 60s

      request-log: true

      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
          url-expression: "'grayLb://'+serviceId"

      routes:
        # ---- system 服务 ----
        - id: system-auth
          uri: grayLb://matrix-system
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

        - id: system-admin
          uri: grayLb://matrix-system
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=0

        - id: system-role
          uri: grayLb://matrix-system
          predicates:
            - Path=/role/**
          filters:
            - StripPrefix=0

        - id: system-menu
          uri: grayLb://matrix-system
          predicates:
            - Path=/menu/**
          filters:
            - StripPrefix=0

        - id: system-resource
          uri: grayLb://matrix-system
          predicates:
            - Path=/resource/**
          filters:
            - StripPrefix=0

        - id: system-tenant
          uri: grayLb://matrix-system
          predicates:
            - Path=/tenant/**
          filters:
            - StripPrefix=0

        - id: system-dept
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/dept/**
          filters:
            - StripPrefix=1

        - id: system-post
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/post/**
          filters:
            - StripPrefix=1

        - id: system-dict-type
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/dict-type/**
          filters:
            - StripPrefix=1

        - id: system-dict-data
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/dict-data/**
          filters:
            - StripPrefix=1

        - id: system-config
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/config/**
          filters:
            - StripPrefix=1

        - id: system-notice
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/notice/**
          filters:
            - StripPrefix=1

        - id: system-login-log
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/login-log/**
          filters:
            - StripPrefix=1

        - id: system-operate-log
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/operate-log/**
          filters:
            - StripPrefix=1

        - id: system-client
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/client/**
          filters:
            - StripPrefix=1

        - id: system-social-user
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/social-user/**
          filters:
            - StripPrefix=1

        - id: system-message
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/message/**
          filters:
            - StripPrefix=1

        - id: system-tenant-package
          uri: grayLb://matrix-system
          predicates:
            - Path=/system/tenant-package/**
          filters:
            - StripPrefix=1

        - id: system-sys
          uri: grayLb://matrix-system
          predicates:
            - Path=/sys/**
          filters:
            - StripPrefix=0

        # ---- resource 服务 ----
        - id: resource-oss
          uri: grayLb://matrix-resource
          predicates:
            - Path=/oss/**
          filters:
            - StripPrefix=0

        - id: resource-sms
          uri: grayLb://matrix-resource
          predicates:
            - Path=/sms/**
          filters:
            - StripPrefix=0

        - id: resource-email
          uri: grayLb://matrix-resource
          predicates:
            - Path=/email/**
          filters:
            - StripPrefix=0

        - id: resource-ip
          uri: grayLb://matrix-resource
          predicates:
            - Path=/ip/**
          filters:
            - StripPrefix=0

        - id: resource-jpush
          uri: grayLb://matrix-resource
          predicates:
            - Path=/jpush/**
          filters:
            - StripPrefix=0

        - id: resource-ocr
          uri: grayLb://matrix-resource
          predicates:
            - Path=/ocr/**
          filters:
            - StripPrefix=0

# Feign 客户端配置
feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000
        logger-level: none

# ===================== Matrix 网关配置 =====================
matrix:
  # 安全白名单 (matrix.security.ignore → IgnoreWhiteProperties)
  security:
    ignore:
      whites:
        - /actuator/health
        - /code
        - /csrf
        - /auth/**

  # 验证码 (matrix.captcha → CaptchaProperties)
  captcha:
    enabled: true
    type: MATH
    category: CIRCLE
    number-length: 1
    char-length: 4

  # 网关分布式限流 (matrix.rate-limiter → RateLimiterProperties)
  rate-limiter:
    enabled: true
    replenish-rate: 10
    burst-capacity: 20
    key-type: IP

  # 黑名单 (matrix.black-list → BlackListProperties, 字段 ipList)
  black-list:
    enable: false
    ip-list:

  # XSS (matrix.xss → XssProperties)
  xss:
    enabled: false
    excludeUrls:

  # 文档 (matrix.doc)
  doc:
    enabled: true
    title: "Matrix Cloud Gateway API"

# 网关 XSS Filter 使用 security.xss.enabled (GatewayConfig 中 @ConditionalOnProperty)
security:
  xss:
    enabled: false
