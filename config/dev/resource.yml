# ===================== matrix-resource 资源配置 =====================

spring:
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://${DATASOURCE_HOST:127.0.0.1:3306}/${DATASOURCE_DB:matrix}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&rewriteBatchedStatements=true&allowMultiQueries=true&allowPublicKeyRetrieval=true
          username: ${DATASOURCE_USERNAME:root}
          password: ${DATASOURCE_PASSWORD:matrix}
          driver-class-name: com.mysql.cj.jdbc.Driver

# ===================== Matrix 模块配置 =====================
matrix:
  # 多租户 (matrix.tenant)
  tenant:
    enable: true
    ignore-urls:
      - /resource/ip/**
    ignore-tables:
      - sys_contact_log
      - sys_region_dict

  # 短信 (matrix.sms)
  sms:
    sms-validate-ignore:
    is-print: false
    config-type: yaml
    blends:
      alibaba:
        supplier: alibaba
        access-key-id:
        access-key-secret:
        signature:

  # 极光推送 (matrix.jpush)
  jpush:
    TEST:
      app-key:
      master-secret:
      apns-production: false
      private-key:

  # 对象存储 S3 兼容 (matrix.oss → com.matrix.oss.config.OssProperties)
  oss:
    enabled: false
    endpoint:
    region: cn-hangzhou
    access-key:
    secret-key:
    bucket:
    domain:
    max-upload-size: 104857600
    presigned-expiration: 3600

  # 邮件 (matrix.mail)
  mail:
    enabled: true
    from:
    from-name: "Matrix Cloud"

  # 社交登录 (matrix.social)
  social:
    enabled: false
    platforms:
      gitee:
        client-id:
        client-secret:
        redirect-uri:
      github:
        client-id:
        client-secret:
        redirect-uri:

  # RocketMQ + 消息队列 (matrix.mq)
  mq:
    enabled: false
    ons-addr:
    access-key:
    secret-key:
    producers:
    consumers:

  # WebSocket + SSE (matrix.websocket / matrix.websocket.sse)
  websocket:
    enabled: false
    path: /ws
    sender-type: local
    allowed-origins: "*"
    sse:
      enabled: false

  # OCR 识别 (matrix.ocr → OcrProperties)
  ocr:
    enabled: false
    secret-id:
    secret-key:

