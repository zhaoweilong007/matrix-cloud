# ===================== matrix-resource 资源配置 =====================

spring:
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://${DATASOURCE_HOST:127.0.0.1:3306}/${DATASOURCE_DB:matrix}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&rewriteBatchedStatements=true&allowMultiQueries=true&allowPublicKeyRetrieval=true
          username: ${DATASOURCE_USERNAME:root}
          password: ${DATASOURCE_PASSWORD:matrix}
          driver-class-name: com.mysql.cj.jdbc.Driver

# ===================== Matrix 模块配置 =====================
matrix:
  # 多租户
  tenant:
    enable: true
    ignore-urls:
      - /resource/ip/**
    ignore-tables:
      - sys_contact_log
      - sys_region_dict

  # 短信
  sms:
    sms-validate-ignore:
    is-print: false
    config-type: yaml
    blends:
      alibaba:
        supplier: alibaba
        access-key-id:
        access-key-secret:
        signature:

  # 极光推送
  jpush:
    TEST:
      app-key:
      master-secret:
      apns-production: false
      private-key:

  # 对象存储（S3 兼容）
  oss:
    enabled: true
    access-key-id:
    access-key-secret:
    endpoint:
    bucket-name:
    prefix:
    max-upload-size: 100MB
    presigned-expiration: 3600

  # 邮件
  mail:
    enabled: true
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@example.com}
    from-name: "Matrix Cloud"

  # 社交登录
  social:
    enabled: false
    type:
      GITEE:
        client-id:
        client-secret:
        redirect-uri:
      GITHUB:
        client-id:
        client-secret:
        redirect-uri:

  # 消息队列
  mq:
    enabled: false
    ons-addr:
    access-key:
    secret-key:
    producers:
    consumers:

  # WebSocket
  websocket:
    enabled: false
    path: /ws
    sender-type: local
    allowed-origins:
      - "*"

  # SSE
  websocket:
    sse:
      enabled: false
      path: /sse

  # 监控
  monitor:
    trace-enable: true
    metrics-enable: true
