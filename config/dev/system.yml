matrix:
  tenant:
    enable: true
    ignore-urls:
      - /auth/**
      - /easyTrans/proxy/**
    ignoreTables:
      - sys_menu
      - sys_role_menu
      - sys_user_role
      - sys_config
      - sys_dict_data
      - sys_dict_type
      - sys_region_dict

  load-balance:
    gray:
      enabled: true
      chooser: com.matrix.feign.chooser.ProfileRuleChooser
  monitor:
    traceEnable: true
    metricsEnable: true