# ===================== matrix-system 服务配置 =====================
# 仅包含 matrix-system 特有的配置或覆盖 application-common.yml 默认值的配置

matrix:
  # 多租户 (matrix.tenant) - 覆盖公共 ignore-tables
  tenant:
    enable: true
    ignore-urls:
      - /auth/**
      - /easyTrans/proxy/**
    ignore-tables:
      - sys_menu
      - sys_role_menu
      - sys_user_role
      - sys_config
      - sys_dict_data
      - sys_dict_type
      - sys_region_dict
      - sys_login_log
      - sys_operate_log
      - sys_client
      - sys_social
      - sys_message
      - sys_role_dept
      - sys_tenant

  # 安全白名单 (matrix.security.ignore)
  security:
    ignore:
      whites:
        - /auth/**
        - /actuator/**
    tenant:
      auth-url:

  # 验证码 (matrix.captcha) - system 模块启用
  captcha:
    enabled: true

  # 功能开关 (matrix.feature.toggle)
  feature:
    toggle:
      features:
        social-login: false
        oauth2: false
        websocket: false
        sse: false

  # API 文档 (matrix.doc)
  doc:
    enabled: true
    title: "Matrix Cloud System API"
    description: "系统管理服务接口文档"
    version: "1.0.0"

  # 访问日志 (matrix.access-log) - system 模块开启
  access-log:
    enable: true
    ignore-urls:
      - /actuator/**

  # 异步任务线程池 (matrix.async-task)
  async-task:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 200
    thread-name-prefix: system-async-

  # 消息队列 (matrix.mq) - system 模块开启 Redis MQ
  mq:
    enabled: false
    redis:
      enabled: true

  # WebSocket + SSE (matrix.websocket / matrix.websocket.sse)
  websocket:
    enabled: false
    path: /ws
    sender-type: local
    allowed-origins: "*"
    sse:
      enabled: false
      path: /sse

  # API 签名 (matrix.api-signature) - system 模块特有
  api-signature:
    secrets:
      default: default-secret-key

  # 黑名单 (matrix.black-list)
  black-list:
    enable: false
    ip-list:

  # 密码策略 (matrix.user.password)
  user:
    password:
      max-retry-count: 5
      lock-time: 10
