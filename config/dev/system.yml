# ===================== matrix-system 服务配置 =====================

# 多租户配置 (matrix.tenant)
matrix:
  tenant:
    enable: true
    ignore-urls:
      - /auth/**
      - /easyTrans/proxy/**
    ignore-tables:
      - sys_menu
      - sys_role_menu
      - sys_user_role
      - sys_config
      - sys_dict_data
      - sys_dict_type
      - sys_region_dict
      - sys_login_log
      - sys_operate_log
      - sys_client
      - sys_social
      - sys_message
      - sys_role_dept
      - sys_tenant

  # 安全配置 (matrix.security.ignore / matrix.security.tenant)
  security:
    ignore:
      whites:
        - /auth/**
        - /actuator/**
    tenant:
      auth-url:

  # 验证码配置 (matrix.captcha)
  captcha:
    enabled: true
    type: MATH
    category: CIRCLE
    number-length: 1
    char-length: 4

  # XSS 过滤 (matrix.xss)
  xss:
    enabled: false
    excludeUrls:

  # 演示模式 (matrix.demo，DemoFilter 读取)
  demo: false

  # API 加解密 (matrix.crypto)
  crypto:
    enabled: false
    type: AES
    secret-key:

  # 功能开关 (matrix.feature.toggle)
  feature:
    toggle:
      features:
        social-login: false
        oauth2: false
        websocket: false
        sse: false

  # API 文档 (matrix.doc)
  doc:
    enabled: true
    title: "Matrix Cloud System API"
    description: "系统管理服务接口文档"
    version: "1.0.0"

  # 访问日志 (matrix.access-log, 属性 enable)
  access-log:
    enable: true
    ignore-urls:
      - /actuator/**

  # 异步任务线程池 (matrix.asyc-task, 注意代码中的拼写)
  asyc-task:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 200
    thread-name-prefix: system-async-

  # 灰度负载均衡 (matrix.load-balance.gray)
  load-balance:
    gray:
      enabled: true
      defaultVersion: "1.0"
      chooser: com.matrix.feign.chooser.ProfileRuleChooser

  # 监控 (matrix.monitor - @ConditionalOnProperty)
  monitor:
    traceEnable: true
    metricsEnable: true

  # 同主机优先负载均衡 (matrix.loadbalancer.same-host)
  loadbalancer:
    same-host:
      enabled: true

  # 消息队列 (matrix.mq / matrix.mq.redis)
  mq:
    enabled: false
    redis:
      enabled: true

  # WebSocket + SSE (matrix.websocket / matrix.websocket.sse)
  websocket:
    enabled: false
    path: /ws
    sender-type: local
    allowed-origins: "*"
    sse:
      enabled: false
      path: /sse

  # API 签名 (matrix.api-signature)
  api-signature:
    secrets:
      default: default-secret-key

  # 黑名单 (matrix.black-list)
  black-list:
    enable: false
    ip-list:

# 密码策略
user:
  password:
    max-retry-count: 5
    lock-time: 10
