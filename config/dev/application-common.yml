# ===================== 通用配置（所有服务共享） =====================

# 密码策略
user:
  password:
    max-retry-count: 5
    lock-time: 10

server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 10s
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 100MB

  cloud:
    nacos:
      discovery:
        metadata:
          user.name: matrix
          user.password: 123456
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
      scg:
        fallback:
          content-type: application/json
          mode: response
          response-status: 429
          response-body: '{"code":429,"success":false,"message":"请求太频繁，请稍后重试"}'

  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
    throw-exception-if-no-handler-found: true
    static-path-pattern: /statics/**

  messages:
    basename: i18n/messages
    encoding: utf-8
    fallback-to-system-locale: true

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      INDENT_OUTPUT: false
      fail_on_empty_beans: false
    deserialization:
      fail_on_unknown_properties: false

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: matrix
      database: 0

# MyBatis-Plus 配置
mybatis-plus:
  encryptor:
    password: ${ENCRYPTOR:}
  mapperPackage: com.matrix.**.mapper
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_null
      update-strategy: not_null
      where-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    auto-mapping-behavior: full
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
    typeEnumsPackage: com.matrix.**.enums
  check-config-location: false
  type-aliases-package: com.matrix.**.entity,com.matrix.**.vo

mybatis-plus-join:
  banner: false

# Redisson 分布式锁/缓存配置
redisson:
  threads: 4
  nettyThreads: 8
  singleServerConfig:
    enable: true
    address: ${REDIS_MASTER_ADDR:}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:}
  masterSlaveServersConfig:
    enable: true
    database: ${REDIS_DATABASE:}
    password: ${REDIS_PASSWORD:}
    masterAddress: ${REDIS_MASTER_ADDR:}
    slaveAddresses:
      - ${REDIS_SLAVE_ADDR:}
    clientName: ${spring.application.name}
    masterConnectionMinimumIdleSize: 4
    masterConnectionPoolSize: 8
    slaveConnectionMinimumIdleSize: 4
    slaveConnectionPoolSize: 8
    idleConnectionTimeout: 10000
    timeout: 8000
    subscriptionConnectionPoolSize: 4
    readMode: "SLAVE"
    subscriptionMode: "MASTER"

# OpenFeign 配置
feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000
        logger-level: basic
  compression:
    request:
      enabled: false
    response:
      enabled: false
  metrics:
    enabled: true

# Sa-Token 认证配置
sa-token:
  jwt-secret-key: qpufihmnjkzghgrfmnkvmzjyquiepvnhftsgq
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  check-same-token: true
  same-token-timeout: -1
  is-concurrent: true
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  token-prefix: "Bearer"
  is-log: false
  basic: ${spring.cloud.nacos.discovery.metadata.user.name}:${spring.cloud.nacos.discovery.metadata.user.password}

# Actuator 端点配置
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# XXL-Job 分布式定时任务
xxl:
  job:
    enabled: true
    admin:
      address: ${XXL_JOB_ADDR:}
      access-token: ${XXL_JOB_TOKEN:}
    executor:
      app-name: ${spring.application.name}
      log-retention-days: 30
      log-path: ${APP_LOG_PATH:/tmp/matrix-logs}/${spring.application.name}/xxlJob

# Seata 分布式事务
seata:
  tx-service-group: ${spring.application.name}-group
  config:
    type: nacos
    nacos:
      server-addr: ${spring.cloud.nacos.server-addr}
      group: SEATA_GROUP
      namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      data-id: seataServer.properties
  registry:
    type: seata
    seata:
      server-addr: ${seata.namingserver-addr:seata-naming-server:8081}
      cluster: default
      namespace: public
      username: seata
      password: seata

# Lock4j 分布式锁
lock4j:
  acquire-timeout: 3000
  expire: 30000

# 微信小程序
wx:
  miniapp:
    appid:
    secret:
    config-storage:
      type: redisson
      key-prefix: wa
      http-client-type: httpclient

# BeanSearcher 配置
bean-searcher:
  params:
    pagination:
      max-allowed-size: 100
      default-size: 10
      page: pageNum
      size: pageSize
      start: 1

# Easy-Trans 翻译配置
easy-trans:
  is-enable-redis: true
  is-enable-global: true
  is-enable-tile: true
  dict-use-redis: true
  is-enable-map-result: true
  multiple-data-sources: true
  mp-new: true

# ===================== Matrix 通用配置 =====================
matrix:
  # 访问日志 (prefix=matrix.access-log, 属性 enable 而非 enabled)
  access-log:
    enable: false

  # 灰度负载均衡 (prefix=matrix.load-balance.gray)
  load-balance:
    gray:
      enabled: true
      defaultVersion: "1.0"
      chooser: com.matrix.feign.chooser.ProfileRuleChooser

  # 演示模式 (DemoFilter 检查 matrix.demo=true)
  demo: false

  # API 加解密 (matrix.crypto)
  crypto:
    enabled: false
    type: AES
    secret-key:

  # 监控 (matrix.monitor) - 非 @ConfigurationProperties，通过 @ConditionalOnProperty 读取
  monitor:
    traceEnable: true
    metricsEnable: true

  # 消息队列 (matrix.mq / matrix.mq.redis)
  mq:
    enabled: false
    ons-addr: ${MQ_ONSADDR:}
    redis:
      enabled: false

  # 同主机优先负载均衡 (matrix.loadbalancer.same-host)
  loadbalancer:
    same-host:
      enabled: true

# 网易易盾内容审核
yidun:
  secret-id:
  secret-key:
  business-id:
  img-business-id:
  text-call-back:
  img-call-back:

# 日志级别
logging:
  level:
    com.alibaba.cloud.seata: error
    org.springframework.cloud.openfeign: warn
    com.alibaba.nacos: warn
    org.springframework: warn
    com.matrix.datapermission: debug
