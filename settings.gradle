pluginManagement {
    repositories {
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
    }
    plugins {
        id 'org.springframework.boot' version '3.5.7' apply false
        id 'io.spring.dependency-management' version '1.1.7' apply false
        id 'com.google.cloud.tools.jib' version '3.5.2' apply false
        id 'org.sonarqube' version '4.2.1.3168'
    }
}

rootProject.name = 'matrix-cloud'

include 'matrix-bom'
include 'matrix-core:matrix-common'
include 'matrix-core:matrix-auto'
include 'matrix-core:matrix-validator'
include 'matrix-core:matrix-redis'
include 'matrix-core:matrix-idempotent'
include 'matrix-core:matrix-feign'
include 'matrix-core:matrix-web'
include 'matrix-core:matrix-auth'
include 'matrix-core:matrix-config'
include 'matrix-core:matrix-es'
include 'matrix-core:matrix-mongodb'
include 'matrix-core:matrix-prometheus'
include 'matrix-core:matrix-excel'
include 'matrix-core:matrix-job'
include 'matrix-core:matrix-jpush'
include 'matrix-core:matrix-lock'
include 'matrix-core:matrix-mq'
include 'matrix-core:matrix-mybatis'
include 'matrix-core:matrix-tenant'
include 'matrix-core:matrix-oss'
include 'matrix-core:matrix-sms'
include 'matrix-core:matrix-seata'
include 'matrix-core:matrix-sensitive'
include 'matrix-core:matrix-swagger'
include 'matrix-core:matrix-api'
include 'matrix-core:matrix-test'
include 'matrix-core:matrix-translation'
include 'matrix-core:matrix-sentinel'
include 'matrix-core:matrix-strategy'
include 'matrix-core:matrix-log'
include 'matrix-core:matrix-data-permission'

include 'matrix-admin'
include 'matrix-gateway'
include 'matrix-resource:resource-api'
include 'matrix-resource:resource-biz'

