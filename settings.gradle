pluginManagement {
    repositories {
        maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
    }
}

rootProject.name = 'matrix-cloud'

// 排除非模块目录
def excludedName(file) {
    return !(file.name in [
            "build", "src", "out", "bin",
            ".gradle", ".idea", ".claude", ".github",
            "config", "deploy", "deploy-dev", "deploy-prod",
            "mysql_data", "logs", "doc"
    ])
}

// 一层模块（直接子目录）
for (name in ['matrix-bom', 'matrix-admin', 'matrix-gateway']) {
    include name
}

// 两层模块：matrix-core
file("${rootDir}/matrix-core").listFiles()?.each { dir ->
    if (dir.directory && excludedName(dir)) {
        include "matrix-core:${dir.name}"
    }
}

// 两层模块：matrix-resource
file("${rootDir}/matrix-resource").listFiles()?.each { dir ->
    if (dir.directory && excludedName(dir)) {
        include "matrix-resource:${dir.name}"
    }
}

