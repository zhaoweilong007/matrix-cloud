pluginManagement {
    repositories {
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
    }
    plugins {
        id 'org.springframework.boot' version '3.5.7' apply false
        id 'io.spring.dependency-management' version '1.1.7' apply false
        id 'com.google.cloud.tools.jib' version '3.5.2' apply false
        id 'org.sonarqube' version '4.2.1.3168'
    }
}

rootProject.name = 'matrix-cloud'

// 排除非模块目录
def excludedName(file) {
    return file.name != "build"
            && file.name != "src"
            && file.name != "out"
            && file.name != "bin"
            && file.name != ".gradle"
            && file.name != ".idea"
}

// 一层模块（直接子目录）
['matrix-bom', 'matrix-admin', 'matrix-gateway'].each {
    include it
}

// 两层模块：matrix-core
file("${rootDir}/matrix-core").eachDir { dir ->
    if (excludedName(dir)) {
        include "matrix-core:${dir.name}"
    }
}

// 两层模块：matrix-resource
file("${rootDir}/matrix-resource").eachDir { dir ->
    if (excludedName(dir)) {
        include "matrix-resource:${dir.name}"
    }
}

