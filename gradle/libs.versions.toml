[bundles]
mybatis = ["mybatis-plus", "mybatis-plus-join", "dynamic-datasource", "druid"]
sa-token = ["sa-token-core", "sa-token-jwt", "sa-token-redisson"]
skywalking = ["skywalking-toolkit-trace", "skywalking-toolkit-logback", "skywalking-toolkit-opentracing"]
easy-trans = ["easy-trans", "easy-trans-mybatis", "easy-trans-anno"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springboot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
