apply plugin: 'checkstyle'

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configFile = rootProject.file('code-analysis/checkstyle/matrix-checks.xml')
    ignoreFailures = true
    showViolations = true
    maxWarnings = 1000
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}
