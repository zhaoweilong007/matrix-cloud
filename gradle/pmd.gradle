apply plugin: 'pmd'

pmd {
    toolVersion = libs.versions.pmd.get()
    ignoreFailures = true
    incrementalAnalysis = true
    threads = 4
    rulesMinimumPriority = 5
    ruleSetFiles = files("${rootProject.projectDir}/code-analysis/pmd/pmd.xml")
}

tasks.withType(Pmd).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}
