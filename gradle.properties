# =========== Project ===========
PROFILE=dev
VERSION=3.0.0
GROUP=com.matrix
DEVELOPER_NAME=zhaoWeiLong
DEVELOPER_EMAIL=zhaoweilong176@gmail.com

# =========== 插件版本：统一在 gradle/libs.versions.toml [plugins] 管理 ===========

# =========== Gradle ===========
GRADLE_VERSION=9.6.1
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xms512m -Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseZGC -XX:+ZGenerational

# 配置缓存
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# 文件系统监控（加速增量构建）
org.gradle.vfs.watch=true

# 欢迎日志抑制
org.gradle.welcome=never

# 并行 Worker 数（根据 CPU 核数调整，默认=核数）
# org.gradle.workers.max=4

# =========== SonarQube ===========
