# =========== Project ===========
PROFILE=dev
VERSION=3.0.0
GROUP=com.matrix
DEVELOPER_NAME=zhaoWeiLong
DEVELOPER_EMAIL=zhaoweilong176@gmail.com

# =========== 插件版本（与 libs.versions.toml 保持一致） ===========
springBootVersion=3.5.7
dependencyManagementVersion=1.1.7
jibVersion=3.5.2
sonarqubeVersion=4.2.1.3168
spotlessVersion=8.6.0

# =========== Gradle ===========
GRADLE_VERSION=8.14.3
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xms512m -Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseZGC

# 配置缓存
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# 文件系统监控（加速增量构建）
org.gradle.vfs.watch=true

