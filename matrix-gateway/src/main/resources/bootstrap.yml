server:
  port: 9000

spring:
  application:
    name: matrix-gateway
  profiles:
    active: ${PROFILE:dev}
  cloud:
    nacos:
      config:
        username: nacos
        password: nacos
      discovery:
        username: nacos
        password: nacos
  config:
    import:
      - optional:nacos:env.properties
      - optional:nacos:application-common.yml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: matrix
      database: 0
