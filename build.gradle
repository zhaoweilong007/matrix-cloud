plugins {
    id 'base'
    id 'java-platform'
    id 'org.sonarqube'
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management' apply false
    id 'com.google.cloud.tools.jib' apply false
}

// 应用模块（产出可启动 jar 和 Docker 镜像）
ext.appModules = [
        project(':matrix-admin'),
        project(':matrix-gateway'),
        project(':matrix-resource:resource-biz'),
]
def appModules = ext.appModules

// 所有 Java 模块（排除 BOM）
def commons = subprojects - project(':matrix-bom')

wrapper {
    gradleVersion = GRADLE_VERSION
}

sonar {
    properties {
        property "sonar.projectKey", findProperty('sonar.projectKey') ?: ''
        property "sonar.projectName", findProperty('sonar.projectName') ?: 'matrix-cloud'
        property "sonar.host.url", findProperty('sonar.host.url') ?: 'http://localhost:9000'
        property "sonar.token", findProperty('sonar.token') ?: ''
    }
}

allprojects {
    group = GROUP
    version = VERSION

    repositories {
        mavenLocal()
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        mavenCentral()
    }
}

// ============================================================
// 通用配置：所有非 BOM 模块共享
// ============================================================
configure(commons) {
    apply plugin: 'idea'
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.sonarqube'
    apply plugin: 'io.spring.dependency-management'
    apply from: "${rootProject.projectDir}/version.gradle"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    compileJava {
        options.encoding = 'UTF-8'
        options.compilerArgs.add '-parameters'
    }

    compileTestJava {
        options.encoding = 'UTF-8'
        options.compilerArgs.add '-parameters'
    }

    dependencyManagement {
        imports {
            mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:${springCloudAlibabaVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom "net.dreamlu:mica-bom:${micaVersion}"
        }
    }

    dependencies {
        implementation platform(project(':matrix-bom'))

        // Lombok：所有模块通用
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        // MapStruct Plus：所有模块通用
        implementation "io.github.linpeilie:mapstruct-plus-spring-boot-starter:${mapstructPlusVersion}"
        annotationProcessor "io.github.linpeilie:mapstruct-plus-processor:${mapstructPlusVersion}"
        testAnnotationProcessor "io.github.linpeilie:mapstruct-plus-processor:${mapstructPlusVersion}"

        // mica-auto：自动配置注册器，所有模块统一应用
        compileOnly 'net.dreamlu:mica-auto'
        annotationProcessor 'net.dreamlu:mica-auto'
    }

    test {
        enabled = false
        useJUnitPlatform()
    }

    compileJava.dependsOn(processResources)
}

// ============================================================
// 库模块配置：禁用 bootJar，启用普通 jar
// ============================================================
configure(commons - appModules) {
    tasks.matching { it.name == 'bootJar' }.configureEach { enabled = false }
    jar { enabled = true }
}

// ============================================================
// 应用模块配置：启用 bootJar、Spring Boot 插件
// ============================================================
configure(appModules) {
    apply plugin: 'org.springframework.boot'

    springBoot {
        buildInfo()
    }
    bootJar { enabled = true }
    jar { enabled = false }
}

// ============================================================
// Jib 镜像构建配置
// ============================================================
apply from: "${rootProject.projectDir}/deploy.gradle"
