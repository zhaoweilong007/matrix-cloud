plugins {
    id 'base'
    id 'java-platform'
    alias(libs.plugins.sonarqube)
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.jib) apply false
    alias(libs.plugins.spotless) apply false
    alias(libs.plugins.spotbugs) apply false
}

// 应用模块（产出可启动 jar 和 Docker 镜像）
def appModules = [
        project(':matrix-admin'),
        project(':matrix-gateway'),
        project(':matrix-resource:resource-biz'),
        project(':matrix-system:system-biz'),
]
ext.appModules = appModules

// Gradle 9.x: 提取版本目录引用
ext {
    checkstyleVersion = libs.versions.checkstyle.get()
    pmdVersion = libs.versions.pmd.get()
}

wrapper {
    gradleVersion = GRADLE_VERSION
}

sonar {
    properties {
        property "sonar.projectKey", findProperty('sonar.projectKey') ?: ''
        property "sonar.projectName", findProperty('sonar.projectName') ?: 'matrix-cloud'
        property "sonar.host.url", findProperty('sonar.host.url') ?: 'http://localhost:9000'
        property "sonar.token", findProperty('sonar.token') ?: ''
    }
}

allprojects {
    group = GROUP
    version = VERSION
}

// ============================================================
// 通用配置：所有非 BOM 模块共享
// ============================================================
subprojects {
    if (project == project(':matrix-bom')) return

    plugins.apply('idea')
    plugins.apply('java')
    plugins.apply('java-library')
    plugins.apply('org.sonarqube')

    // 静态分析工具
    apply from: "${rootProject.projectDir}/gradle/checkstyle.gradle"
    apply from: "${rootProject.projectDir}/gradle/spotbugs.gradle"
    apply from: "${rootProject.projectDir}/gradle/pmd.gradle"
    apply from: "${rootProject.projectDir}/gradle/spotless.gradle"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    compileJava {
        options.encoding = 'UTF-8'
        options.compilerArgs.add '-parameters'
    }

    compileTestJava {
        options.encoding = 'UTF-8'
        options.compilerArgs.add '-parameters'
    }

    dependencies {
        implementation platform(project(':matrix-bom'))
        compileOnly platform(project(':matrix-bom'))
        runtimeOnly platform(project(':matrix-bom'))
        annotationProcessor platform(project(':matrix-bom'))
        testImplementation platform(project(':matrix-bom'))
        testCompileOnly platform(project(':matrix-bom'))
        testRuntimeOnly platform(project(':matrix-bom'))
        testAnnotationProcessor platform(project(':matrix-bom'))

        testImplementation rootProject.libs.junit.jupiter
        testRuntimeOnly rootProject.libs.junit.platform.launcher

        compileOnly rootProject.libs.lombok
        annotationProcessor rootProject.libs.lombok
        annotationProcessor rootProject.libs.lombok.mapstruct.binding
        testCompileOnly rootProject.libs.lombok
        testAnnotationProcessor rootProject.libs.lombok

        implementation rootProject.libs.mapstruct.plus.starter
        annotationProcessor rootProject.libs.mapstruct.plus.processor
        testAnnotationProcessor rootProject.libs.mapstruct.plus.processor

        compileOnly rootProject.libs.spotbugs.annotations
    }

    configurations.configureEach {
        if (canBeResolved) {
            resolutionStrategy.activateDependencyLocking()
        }
    }

    test {
        useJUnitPlatform {
            excludeTags 'integration'
        }
    }

    compileJava.dependsOn(processResources)

    // 库模块禁用 bootJar
    if (project !in appModules) {
        tasks.matching { it.name == 'bootJar' }.configureEach { enabled = false }
        jar { enabled = true }
    }

    // 应用模块启用 bootJar + Spring Boot
    if (project in appModules) {
        plugins.apply('org.springframework.boot')
        springBoot { buildInfo() }
        bootJar { enabled = true }
        jar { enabled = false }
    }
}

// ============================================================
// Jib 镜像构建配置
// ============================================================
apply from: "${rootProject.projectDir}/deploy.gradle"
