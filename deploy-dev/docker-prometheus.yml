networks:
  matrix_cloud:
    name: matrix_cloud
    driver: bridge


services:
  # BanyanDB - SkyWalking 10.4.0 存储后端（替代 Elasticsearch）
  banyandb:
    image: apache/skywalking-banyandb:${BANYANDB_VERSION:-0.8.0}
    container_name: banyandb
    command: standalone
    ports:
      - "17912:17912"
      - "17913:17913"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./banyandb/data:/var/lib/banyandb
    networks:
      - matrix_cloud
    restart: always
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 0.5
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:17913 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  sky-oap:
    image: apache/skywalking-oap-server:${SKYWALING_VERSION}
    container_name: sky-oap
    volumes:
      - ./skywalking/config:/skywalking/ext-config
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      TZ: Asia/Shanghai
      SW_STORAGE: banyandb
      # BanyanDB 配置 - 通过环境变量传递
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_STORAGE_BANYANDB_MAX_BULK_SIZE: 10000
      SW_STORAGE_BANYANDB_FLUSH_INTERVAL: 15
      SW_STORAGE_BANYANDB_FLUSH_TIMEOUT: 10
      SW_STORAGE_BANYANDB_CONCURRENT_WRITE_THREADS: 15
      SW_STORAGE_BANYANDB_QUERY_MAX_WINDOW_SIZE: 10000
      SW_STORAGE_BANYANDB_QUERY_MAX_SIZE: 10000
      SW_STORAGE_BANYANDB_QUERY_SEGMENT_SIZE: 200
      SW_STORAGE_BANYANDB_QUERY_PROFILE_TASK_SIZE: 200
      SW_STORAGE_BANYANDB_QUERY_PROFILE_DATA_BATCH_SIZE: 100
      # WSL2 兼容性：禁用 Netty epoll 原生传输，使用 NIO
      JAVA_OPTS: "-Dio.grpc.netty.shaded.io.netty.transport.noNative=true -Dio.netty.transport.noNative=true"
    depends_on:
      banyandb:
        condition: service_healthy
    networks:
      - matrix_cloud
    restart: always
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 1.0

  sky-ui:
    image: apache/skywalking-ui:${SKYWALING_UI_VERSION}
    container_name: sky-ui
    depends_on:
      - sky-oap
    ports:
      - "9080:8080"
    environment:
      TZ: Asia/Shanghai
      SW_OAP_ADDRESS: http://sky-oap:12800
    networks:
      - matrix_cloud
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
    ports:
      - "9090:9090"
    restart: always
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./prometheus/grafana/data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    restart: always
    user: "0"
    networks:
      - default

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: always
    networks:
      - default

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    restart: always
    networks:
      - default

  cadvisor:
    image: google/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run/:/var/run/:rw
      - /sys:/sys:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro
      - /var/lib/docker/:/var/lib/docker:ro #linux使用此配置，注释下行配置
    #      - /mnt/wsl/docker-desktop-data/version-pack-data/community/docker/:/rootfs/var/lib/docker:ro #仅适用于window的wsl2配置，挂载docker，否则无法查看容器
    ports:
      - "8081:8080"
    restart: always
    privileged: true
    networks:
      - default
