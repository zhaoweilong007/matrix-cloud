networks:
  matrix_cloud:
    name: matrix_cloud
    driver: bridge

services:
  #https://github.com/nacos-group/nacos-docker
  nacos:
    image: nacos/nacos-server:${NACOS_VERSION}
    container_name: nacos
    env_file:
      - ./env/nacos-standlone-mysql.env
    volumes:
      - ../logs/nacos:/home/nacos/logs
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
      - "9555:9555"
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    networks:
      - matrix_cloud
    # 资源限制
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 0.5
    # 健康检查 - Nacos v3.2.2 启动较慢
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s


  mysql:
    container_name: mysql8
    image: mysql:${MYSQL_VERSION}
    env_file:
      - ./env/mysql.env
    volumes:
      - ../mysql_data:/var/lib/mysql
      #https://raw.githubusercontent.com/alibaba/nacos/3.2.2/distribution/conf/mysql-schema.sql
      #https://github.com/xuxueli/xxl-job/blob/master/doc/db/tables_xxl_job.sql
      #https://github.com/apache/incubator-seata/blob/2.x/script/server/db/mysql.sql
      - ./mysql-init:/docker-entrypoint-initdb.d/
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    restart: always
    networks:
      - matrix_cloud
    # 资源限制 - 最低配置
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 0.5
    # 健康检查
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - ./redis/conf:/redis/config
      # 数据文件
      - ./redis/data/:/redis/data/
    command: "redis-server /redis/config/redis.conf"
    privileged: true
    restart: always
    networks:
      - matrix_cloud
    # 资源限制 - 最低配置
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25


  # https://github.com/lk0423/sentinel-dashboard
  sentinel:
    image: linking0606/sentinel-dashboard:${SENTINEL_VERSION}
    container_name: sentinel
    environment:
      PARAM: -Dserver.port=8088 -Dcsp.sentinel.dashboard.server=localhost:8088 -Dproject.name=sentinel-dashboard -Ddatasource.provider=nacos -Ddatasource.provider.nacos.server-addr=nacos:8848 -Ddatasource.provider.nacos.username=nacos -Ddatasource.provider.nacos.password=nacos -Ddatasource.provider.nacos.namespace=dev
      TZ: Asia/Shanghai
    ports:
      - "8088:8088"
    restart: always
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - matrix_cloud
    # 资源限制 - 最低配置
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.25
    # 健康检查
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8088" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s


  xxl-job-admin:
    image: xuxueli/xxl-job-admin:${XXL_JOB_VERSION}
    container_name: xxl-job-admin
    volumes:
      - ../logs/xxl-job:/data/applogs
      - ./xxl-job/application.properties:/application.properties
    environment:
      TZ: Asia/Shanghai
      PARAMS: --spring.config.location=/application.properties
      JAVA_OPTS: -Xmx256m
    ports:
      - 8090:8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - matrix_cloud
    restart: always
    # 资源限制 - 最低配置
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.25
    # 健康检查
    healthcheck:
      test: [ "CMD-SHELL", "find /proc -name 'cmdline' -exec cat {} \\; 2>/dev/null | grep -q 'java'" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s


  # Seata 2.6.0 NamingServer(control-plane)：独立注册中心 + 控制台 UI
  # Seata 2.6.0 把 console 从 server 移出，且捆绑的 nacos-client 1.4.6 用 v1 naming API(已被 Nacos 3.x 移除)，
  # 故 seata-server 改用自研 namingserver 注册，不再依赖 nacos naming。
  seata-naming-server:
    image: apache/seata-naming-server:${SEATA_NAMING_VERSION}
    container_name: seata-naming-server
    volumes:
      - ./seata/namingserver-application.yml:/seata-naming-server/resources/application.yml
    environment:
      TZ: Asia/Shanghai
      # namingserver 注册端点需鉴权，默认 console user 为空 → 注册返回 401。
      # 用 Spring Boot 标准机制注入 console 用户(seata/seata)，与 seata-server registry 账号一致。
      SPRING_APPLICATION_JSON: '{"console":{"user":{"username":"seata","password":"seata"}}}'
    ports:
      - "8081:8081"
    restart: always
    networks:
      - matrix_cloud
    # 资源限制 - 最低配置
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 0.25
    healthcheck:
      # jib 镜像无 curl/wget，用 bash /dev/tcp 做 TCP 探活
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/8081'" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  seata-server:
    image: apache/seata-server:${SEATA_VERSION}
    container_name: seata-server
    env_file:
      - ./env/seata.env
    ports:
      - "8091:8091"
    volumes:
      - ./seata/application.yml:/seata-server/resources/application.yml
      - ./seata/jdbc/mysql.jar:/seata-server/libs/mysql.jar
    restart: always
    privileged: true
    depends_on:
      seata-naming-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - matrix_cloud
    # 资源限制 - 最低配置
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 0.5
    # 健康检查：2.6.0 server 为非 web 模式(web-application-type:none)，8091 是 Netty RPC 端口，用 TCP 探活
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/8091'" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s


  # RocketMQ 5.5.0 - 最小内存配置
  mqnamesrv:
    image: apache/rocketmq:${ROCKETMQ_VERSION}
    container_name: mqnamesrv
    environment:
      HEAP_OPTS: "-Xms128m -Xmx128m -Xmn64m"
      JAVA_OPT_EXT: -XX:MaxMetaspaceSize=64m
    ports:
      - "9876:9876"
    volumes:
      - ./rocketmq/data/logs:/home/rocketmq/logs
    command: sh mqnamesrv
    restart: always
    networks:
      - matrix_cloud
    # 资源限制 - 最低配置
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25
    # 健康检查
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/9876'" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s


  mqbroker1:
    image: apache/rocketmq:${ROCKETMQ_VERSION}
    container_name: mqbroker1
    ports:
      - "10911:10911"
      - "10909:10909"
      - "10912:10912"
    environment:
      # broker 最小 JVM 配置（broker 需要更多堆外内存）
      HEAP_OPTS: "-Xms512m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=128m"
      JAVA_OPT_EXT: -XX:MaxMetaspaceSize=128m
    volumes:
      - ./rocketmq/broker1/conf/broker.conf:/home/rocketmq/rocketmq-${ROCKETMQ_VERSION}/conf/broker.conf
      - ./rocketmq/broker1/logs:/home/rocketmq/logs/rocketmqlogs
      - ./rocketmq/broker1/store:/home/rocketmq/store
    command: sh mqbroker -c /home/rocketmq/rocketmq-${ROCKETMQ_VERSION}/conf/broker.conf
    depends_on:
      mqnamesrv:
        condition: service_healthy
    restart: always
    networks:
      - matrix_cloud
    # 资源限制
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 0.5
    # 健康检查 - TCP 探活
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/10911'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s


  mqconsole:
    image: styletang/rocketmq-console-ng:latest
    container_name: mqconsole
    ports:
      - "19876:19876"
    environment:
      JAVA_OPTS: -Dserver.port=19876 -Drocketmq.namesrv.addr=mqnamesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
    depends_on:
      mqnamesrv:
        condition: service_healthy
    networks:
      - matrix_cloud
    restart: always
    # 资源限制
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.25
    # 健康检查
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:19876" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
