# 详细配置参考官方 http://seata.io/zh-cn/docs/user/configurations.html
seata:
  tx-service-group: ${spring.application.name}-group
  config:
    type: nacos
    nacos:
      server-addr: ${spring.cloud.nacos.server-addr}
      group: SEATA_GROUP
      namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      data-id: seataServer.properties
  registry:
    # NamingServer 2.6.0.jdk25 与 seata-server 2.6.0(JDK8) 存在兼容问题，改用 Redis 注册
    type: redis
    redis:
      server-addr: ${spring.redis.host:localhost}:${spring.redis.port:6379}
      db: 0
      password: ${spring.redis.password:matrix}
      timeout: 0
      max-conn: 10
      min-conn: 1


