dependencies {
    api project(':matrix-core:matrix-auto')
    api project(':matrix-core:matrix-common')
    api 'org.redisson:redisson-spring-boot-starter'
    api 'org.redisson:redisson-spring-cache:4.6.1'
    api 'org.springframework.boot:spring-boot-starter-cache'
    // SB4 CacheProperties 从 spring-boot-autoconfigure 移至 spring-boot-cache
    api 'org.springframework.boot:spring-boot-cache'
    // Caffeine L1 本地缓存
    api libs.caffeine

    // AOP 支持（RateLimiter 切面）
    api 'org.aspectj:aspectjweaver'
}
